name: OmniSight GSA Auctions Sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnisight-gsa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import official GSA Auctions feed
        env:
          SUPABASE_URL: https://rokrbppnohafumsueicg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: node scripts/omnisight-gsa-sync.mjs
