name: OmniSight scheduled discovery


on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnisight-scheduled-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Run approved-lot discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_URL: https://rokrbppnohafumsueicg.supabase.co
          OMNISIGHT_CRON_SECRET: ${{ secrets.OMNISIGHT_CRON_SECRET }}
        run: |
          test -n "$OMNISIGHT_CRON_SECRET" || { echo "Missing GitHub Actions secret: OMNISIGHT_CRON_SECRET"; exit 1; }
          case "$SUPABASE_URL" in https://*) ;; *) echo "SUPABASE_URL must use HTTPS"; exit 1;; esac
      - name: Invoke Supabase discovery function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OMNISIGHT_CRON_SECRET: ${{ secrets.OMNISIGHT_CRON_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
            --max-time 540 \
            --request POST "$SUPABASE_URL/functions/v1/omnisight-discovery" \
            --header "Content-Type: application/json" \
            --header "x-omnisight-cron-secret: $OMNISIGHT_CRON_SECRET" \
            --data '{}'
