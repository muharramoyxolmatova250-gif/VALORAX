use_default_settings: true

general:
  debug: false
  instance_name: "Valorax OmniSight Search"
  contact_url: "https://valorax.netlify.app/"

server:
  # Internal discovery service only; external provider throttling is handled by
  # provider selection and bounded request rates, not by bypassing CAPTCHAs.
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  request_timeout: 12.0
  max_request_timeout: 18.0
  pool_connections: 20
  pool_maxsize: 20

engines:
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true
  - name: yahoo
    disabled: true
  - name: startpage
    disabled: true
  - name: mojeek
    disabled: true
  - name: bing
    disabled: false
    timeout: 12.0
  - name: yandex
    disabled: false
    timeout: 12.0
