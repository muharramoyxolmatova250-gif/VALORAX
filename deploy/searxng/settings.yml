use_default_settings: true

general:
  debug: false
  instance_name: "Valorax OmniSight Search"
  contact_url: "https://valorax.netlify.app/"

server:
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  request_timeout: 12.0
  max_request_timeout: 18.0
  pool_connections: 20
  pool_maxsize: 20

engines:
  # Providers returning CAPTCHA / rate-limit errors are paused rather than
  # repeatedly hammered. They can be re-enabled after a clean health test.
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true
  # Keep independent engines available for the next health checks.
  - name: bing
    disabled: false
    timeout: 12.0
  - name: startpage
    disabled: false
    timeout: 12.0
  - name: mojeek
    disabled: false
    timeout: 12.0
  - name: yahoo
    disabled: false
    timeout: 12.0
