use_default_settings: true

general:
  debug: false
  instance_name: "Valorax OmniSight Search"
  contact_url: "https://valorax.netlify.app/"

server:
  # Replaced at runtime by the private Render environment variable SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0

engines:
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
