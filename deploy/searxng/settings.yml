use_default_settings: true

general:
  debug: false
  instance_name: "VALORAX OmniSight Search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # Overridden at runtime by SEARXNG_SECRET.
  secret_key: "replace-through-SEARXNG_SECRET"
  # Keep limiter enabled; requires a working Valkey connection.
  limiter: true
  public_instance: false
  image_proxy: false

valkey:
  # Overridden at runtime by SEARXNG_VALKEY_URL.
  url: "valkey://localhost:6379/0"

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
