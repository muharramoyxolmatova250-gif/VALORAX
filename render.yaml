services:
  - type: worker
    name: valorax-omnisight-worker
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: workers/omnisight
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    envVars:
      - key: SUPABASE_URL
        value: https://rokrbppnohafumsueicg.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: SEARXNG_BASE_URL
        value: https://valorax-searxng.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: valorax-searxng-valkey
          property: connectionString
      - key: OMNISIGHT_TARGET_DAILY_RAW
        value: "100000"
      - key: OMNISIGHT_TARGET_DAILY_CANDIDATES
        value: "100000"
      - key: SEARCH_PAGES_PER_QUERY
        value: "3"
      - key: SEARCH_CONCURRENCY
        value: "2"
      - key: WORKER_CONCURRENCY
        value: "5"
  - type: keyvalue
    name: valorax-searxng-valkey
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off
